  ['¿Qué nombre es correcto para subir a Docker Hub?', ['contact-manager@eniriel', 'eniriel:contact-manager/v1', 'eniriel/contact-manager:v1', 'v1/contact-manager:eniriel'], 2, 'usuario/imagen:tag'],

  ['En ports: "8080:5173", el 8080 es…', ['El puerto del contenedor', 'El puerto de tu PC (host)', 'El puerto de Docker Hub', 'El ID del contenedor'], 1, 'host : contenedor. Abrirías http://localhost:8080.'],

  ['Los contenedores necesitan un hipervisor para ejecutarse.', false, 'Eso lo necesitan las máquinas virtuales. Los contenedores corren sobre Docker Engine y comparten el kernel del host.'],

  ['Las imágenes Docker son plantillas de solo lectura.', true, 'Lo que cambia es el contenedor en ejecución, no la imagen.'],

const OPEN = [
  ['¿Qué es Docker y qué problema resuelve?', 'Docker es una plataforma de código abierto que empaqueta una aplicación con todas sus dependencias (librerías, herramientas, configuración, entorno de ejecución) en un contenedor portable. Resuelve el problema de «en mi máquina funciona»: el contenedor se ejecuta igual en cualquier equipo, servidor o nube que tenga Docker.', ['Plataforma de código abierto', 'Empaqueta app + dependencias en un contenedor', '«En mi máquina funciona»', 'Se ejecuta igual en cualquier entorno']],
  ['Explica la diferencia entre una máquina virtual y un contenedor.', 'La máquina virtual virtualiza hardware: sobre un hipervisor corre un sistema operativo huésped completo por cada aplicación, por eso es pesada, lenta de arrancar y consume mucha CPU, RAM y disco. El contenedor no lleva SO propio: comparte el kernel del SO anfitrión mediante Docker Engine y solo agrega las bibliotecas que la app necesita; es ligero y arranca en segundos. Ejemplo: VM = tener 5 PCs dentro de tu PC; Docker = varias apps independientes dentro de tu PC.', ['VM: hipervisor + SO huésped completo', 'Contenedor: comparte el kernel del host (Docker Engine)', 'Rendimiento y recursos', 'Ejemplo de las 5 PCs']],
  ['¿Qué relación hay entre Dockerfile, imagen y contenedor?', 'El Dockerfile es un archivo de texto plano con instrucciones (FROM, COPY, RUN, CMD…). Con docker build se convierte en una imagen: una plantilla de solo lectura formada por capas, una por instrucción. Con docker run la imagen se convierte en un contenedor: la instancia en ejecución. De una imagen se pueden crear muchos contenedores.', ['Dockerfile → build → imagen → run → contenedor', 'Imagen = plantilla de solo lectura por capas', 'Contenedor = instancia ejecutable']],
  ['Describe la arquitectura de Docker: cliente, daemon y registro.', 'El cliente es lo que usamos (docker build, pull, run): envía peticiones a la API REST del daemon. El daemon, en el Docker host, escucha esas peticiones y gestiona imágenes, contenedores, redes y volúmenes. El registro (como Docker Hub) almacena las imágenes; si al hacer run la imagen no está en el host, el daemon la descarga (pull) del registro y luego crea el contenedor.', ['Cliente → API REST → daemon', 'Daemon gestiona imágenes, contenedores, redes, volúmenes', 'Registro almacena imágenes (Docker Hub)']],
  ['¿Qué es Docker Hub y para qué sirven los tags?', 'Docker Hub es un registro en la nube de Docker Inc. para almacenar, compartir y descargar imágenes, con repositorios públicos y privados e imágenes oficiales (node, nginx, mysql). Los tags identifican versiones de una imagen (v1, v2, latest) para manejar distintas versiones de la app. Se sube con docker push usuario/imagen:tag y se descarga con docker pull usuario/imagen:tag.', ['Registro en la nube', 'Público / privado / oficiales', 'Tags = versiones (por defecto latest)', 'push / pull']],
  ['¿Qué es Docker Compose y cuáles son sus ventajas?', 'Es una herramienta para definir y ejecutar aplicaciones multicontenedor en un único archivo YAML (compose.yaml) y levantarlas con un solo comando. Ventajas: control simplificado (todo en un archivo), colaboración eficiente (el YAML se comparte entre desarrollo y operaciones), desarrollo rápido (reutiliza contenedores que no cambiaron) y portabilidad entre entornos (admite variables).', ['Multicontenedor con un YAML', 'Control simplificado', 'Colaboración', 'Desarrollo rápido (caché)', 'Portabilidad (variables)']],
  ['Explica cada parte del compose.yaml de la guía 3.', 'services define los contenedores; app es el nombre del servicio; build con context: . y dockerfile: Dockerfile construye la imagen desde la carpeta actual; container_name le da nombre al contenedor; ports "5173:5173" conecta el puerto de la PC con el del contenedor; volumes .:/app sincroniza el proyecto con /app y /app/node_modules conserva las dependencias del contenedor; restart: unless-stopped lo reinicia si se detiene inesperadamente.', ['services / app', 'build: context y dockerfile', 'container_name', 'ports host:contenedor', 'volumes (.:/app y /app/node_modules)', 'restart']],
  ['¿Qué cambios necesita una aplicación para conectarse a una base de datos dentro de Docker Compose?', 'Agregar un servicio para la base de datos con su imagen oficial (por ejemplo mysql:8.4); definir variables de entorno con usuario, contraseña y nombre de la base; un volumen con nombre para que los datos persistan después de down; depends_on para que la app arranque después de la base; y conectarse usando el nombre del servicio (db) como servidor en lugar de localhost, porque Compose crea una red donde cada servicio se encuentra por su nombre.', ['Servicio db con image', 'environment (usuario, contraseña, base)', 'Volumen para persistir', 'depends_on', 'Host = nombre del servicio, no localhost']],
  ['¿Cuáles son las principales ventajas de usar Docker?', 'Consistencia (la app corre igual en desarrollo y producción), portabilidad (se mueve entre máquinas y nubes sin problemas), modularidad y escalabilidad (microservicios que se empaquetan y escalan por separado) y eficiencia (más ligero que una VM porque no necesita un SO completo). También aislamiento (sin conflictos de versiones) y rapidez (arranca en segundos).', ['Consistencia', 'Portabilidad', 'Modularidad y escalabilidad', 'Eficiencia', 'Aislamiento y rapidez']],
  ['¿Por qué en el Dockerfile se copia package*.json antes de COPY . . y para qué sirve .dockerignore?', 'Cada instrucción es una capa en caché. Si se copian primero solo las dependencias y luego se hace npm install, cuando cambias el código pero no las dependencias Docker reutiliza la capa de npm install y el build es mucho más rápido. El .dockerignore indica qué no copiar a la imagen (node_modules, logs, archivos del editor), lo que la hace más liviana y evita meter dependencias de la PC.', ['Capas y caché', 'npm install no se repite si no cambian dependencias', '.dockerignore excluye node_modules, logs…']],
  ['Actividad de clase: ¿qué necesita realmente una aplicación para funcionar en otra computadora?', 'Las versiones necesarias (por ejemplo Node 24), las librerías y dependencias (las de package.json), las configuraciones (puertos, variables de entorno), un sistema operativo compatible y las bases de datos u otros servicios que use. Docker empaqueta todo eso en la imagen para que no dependa de lo que tenga instalada la otra PC.', ['Versiones', 'Librerías y dependencias', 'Configuraciones', 'Sistema operativo', 'Bases de datos u otros servicios']],
  ['¿Qué ventajas tiene Docker frente a gestores de paquetes, herramientas de configuración y máquinas virtuales?', 'Frente a gestores de paquetes (RPM, DPKG): no hay que instalar dependencias por separado ni pelear con versiones, todo va en una imagen. Frente a herramientas de configuración (Ansible, Puppet…): no hacen falta, la imagen ya es autocontenida y corre igual en distintos entornos. Frente a VMs: Docker es más ligero, rápido y eficiente, aunque pierde algo de aislamiento y seguridad.', ['Paquetes: todo en una imagen', 'Configuración: imagen autocontenida', 'VM: más ligero; algo menos aislado']],
];

const CMD = [
  ['Construir la imagen «mi-app»', 'docker build -t mi-app', 'docker build -t mi-app .', 'Falta el punto final: el contexto de construcción (carpeta actual).'],
  ['Ejecutar y abrir en http://localhost:5173', 'docker run -p 5173 mi-app', 'docker run -it -p 5173:5173 mi-app', 'El mapeo es puerto_PC:puerto_contenedor.'],
  ['Subir la imagen a Docker Hub', 'docker push mi-app:v1', 'docker push eniriel/mi-app:v1', 'Debe empezar con tu usuario (y antes haber hecho docker tag o build con ese nombre).'],
  ['Construir la imagen «Mi-App»', 'docker build -t Mi-App .', 'docker build -t mi-app .', 'Los nombres de imagen van en minúsculas.'],
  ['Entrar a un contenedor basado en node:24-alpine', 'docker exec -it web /bin/bash', 'docker exec -it web sh', 'Alpine no trae bash; se usa sh.'],
  ['Construir e iniciar con Compose', 'docker compose up -build', 'docker compose up --build', 'Las opciones largas llevan dos guiones.'],
  ['Borrar el contenedor «web» que está corriendo', 'docker rm web', 'docker stop web   y luego   docker rm web', 'rm no borra uno en ejecución. También: docker rm -f web.'],
  ['Ver los logs del contenedor «web»', 'docker logs -ft', 'docker logs -ft web', 'Falta el nombre (o ID) del contenedor.'],
  ['CMD para que Vite sea accesible desde la PC', 'CMD ["npm", "run", "dev"]', 'CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]', 'Sin --host 0.0.0.0 Vite solo escucha dentro del contenedor.'],
  ['Ver los contenedores de Compose', 'docker compose up ps', 'docker compose ps', 'up inicia; ps lista.'],
  ['Detener Compose y borrar también los datos de la base', 'docker compose down', 'docker compose down -v', '-v elimina los volúmenes.'],
  ['Descargar la versión 2', 'docker pull eniriel/mi-app', 'docker pull eniriel/mi-app:v2', 'Sin tag descarga latest, no v2.'],
];

const TABS = [
  ['mcq', 'Subrayar', MCQ.length],
  ['pareo', 'Pareo', MATCH.reduce((a, m) => a + m.left.length, 0)],
  ['vf', 'Verdadero / Falso', VF.length],
  ['abiertas', 'Abiertas', OPEN.length],
  ['comandos', 'Comandos', CMD.length],
];
const score = {};
TABS.forEach(([id]) => score[id] = { ok: 0, done: 0 });

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) e.append(k);
  return e;
}
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

function renderScore(active) {
  const s = score[active], total = TABS.find(t => t[0] === active)[2];
  const all = Object.values(score).reduce((a, x) => ({ ok: a.ok + x.ok, done: a.done + x.done }), { ok: 0, done: 0 });
  const box = document.getElementById('score');
  box.replaceChildren(
    el('span', {}, 'Esta sección: ', el('b', {}, `${s.ok}/${s.done}`), ` correctas · ${total - s.done} sin responder`),
    el('span', {}, 'Total: ', el('b', {}, `${all.ok}/${all.done}`)),
    el('div', { class: 'tools' },
      el('button', { class: 'btn', onclick: () => { score[active] = { ok: 0, done: 0 }; build(active, true); } }, 'Reiniciar y barajar')
    )
  );
}
function mark(sec, ok) { score[sec].done++; if (ok) score[sec].ok++; renderScore(sec); }

function buildMCQ(p, shuf) {
  p.append(el('p', { class: 'intro' }, 'Subraya la respuesta correcta. Toca una opción para ver si acertaste y por qué.'));
  (shuf ? shuffle(MCQ) : MCQ).forEach(([stem, opts, ans, why], i) => {
    const order = shuf ? shuffle(opts.map((o, k) => k)) : opts.map((o, k) => k);
    const wrap = el('div', { class: 'opts' });
    const card = el('article', { class: 'q' }, el('span', { class: 'n' }, `Pregunta ${i + 1}`), el('p', { class: 'stem' }, stem), wrap);
    order.forEach((k, pos) => {
      const b = el('button', { class: 'opt', type: 'button', onclick: () => {
        wrap.querySelectorAll('button').forEach(x => x.disabled = true);
        const ok = k === ans;
        b.classList.add(ok ? 'ok' : 'bad');
        if (!ok) wrap.querySelector(`[data-k="${ans}"]`).classList.add('ok');
        card.append(el('p', { class: 'why ' + (ok ? 'ok' : 'bad') }, (ok ? 'Correcto. ' : 'Incorrecto. ') + why));
        mark('mcq', ok);
      }}, el('span', { class: 'l' }, L[pos] + ')'), el('span', {}, opts[k]));
      b.dataset.k = k;
      wrap.append(b);
    });
    p.append(card);
  });
}

function buildMatch(p, shuf) {
  p.append(el('p', { class: 'intro' }, 'Traslada el número de la columna izquierda al concepto que le corresponde a la derecha. Luego presiona «Revisar».'));
  MATCH.forEach((m, mi) => {
    const rows = shuffle(m.right);
    const ol = el('ol', {}, m.left.map(t => el('li', {}, el('span', { class: 'cmd' }, t))));
    const list = el('div', {});
    rows.forEach(([num, txt], ri) => {
      const sel = el('select', { id: `m${mi}-${ri}`, 'aria-label': txt }, el('option', { value: '' }, '—'), m.left.map((_, k) => el('option', { value: k + 1 }, String(k + 1))));
      const r = el('div', { class: 'mrow' }, sel, el('span', {}, txt));
      r.dataset.ans = num;
      list.append(r);
    });
    const btn = el('button', { class: 'btn primary', type: 'button', onclick: () => {
      list.querySelectorAll('.mrow').forEach(r => {
        const v = Number(r.querySelector('select').value), ok = v === Number(r.dataset.ans);
        r.classList.remove('ok', 'bad'); r.classList.add(ok ? 'ok' : 'bad');
        r.querySelector('.fix')?.remove();
        if (!ok) r.append(el('span', { class: 'fix' }, `→ ${r.dataset.ans}`));
        r.querySelector('select').disabled = true;
        mark('pareo', ok);
      });
      btn.disabled = true;
    }}, 'Revisar');
    p.append(el('article', { class: 'q' }, el('span', { class: 'n' }, `Pareo ${mi + 1}`), el('p', { class: 'stem' }, m.title), el('div', { class: 'match' }, ol, list), el('div', {}, btn)));
  });
}

function buildVF(p, shuf) {
  p.append(el('p', { class: 'intro' }, 'Marca V o F. Al responder aparece la justificación: en el examen, si es falsa, explica por qué.'));
  (shuf ? shuffle(VF) : VF).forEach(([stem, ans, why], i) => {
    const wrap = el('div', { class: 'vf' });
    const card = el('article', { class: 'q' }, el('span', { class: 'n' }, `Enunciado ${i + 1}`), el('p', { class: 'stem' }, stem), wrap);
    [['Verdadero', true], ['Falso', false]].forEach(([t, v]) => {
      const b = el('button', { class: 'opt', type: 'button', onclick: () => {
        wrap.querySelectorAll('button').forEach(x => x.disabled = true);
        const ok = v === ans;
        b.classList.add(ok ? 'ok' : 'bad');
        card.append(el('p', { class: 'why ' + (ok ? 'ok' : 'bad') }, `${ans ? 'Verdadero' : 'Falso'}. ${why}`));
        mark('vf', ok);
      }}, t);
      wrap.append(b);
    });
    p.append(card);
  });
}

function buildOpen(p, shuf) {
  p.append(el('p', { class: 'intro' }, 'Escribe tu respuesta con tus palabras y después compárala con la respuesta modelo. Califícate con honestidad según los puntos clave.'));
  (shuf ? shuffle(OPEN) : OPEN).forEach(([stem, model, keys], i) => {
    const ta = el('textarea', { rows: '4', id: `open-${i}`, placeholder: 'Tu respuesta…' });
    const card = el('article', { class: 'q' }, el('span', { class: 'n' }, `Pregunta abierta ${i + 1}`), el('p', { class: 'stem' }, stem), ta);
    const show = el('button', { class: 'btn', type: 'button', onclick: () => {
      show.remove();
      const check = el('div', { class: 'selfcheck' }, '¿Tu respuesta tenía los puntos clave?',
        el('button', { class: 'btn', type: 'button', onclick: () => { mark('abiertas', true); check.replaceChildren('Marcada como correcta.'); } }, 'Sí'),
        el('button', { class: 'btn', type: 'button', onclick: () => { mark('abiertas', false); check.replaceChildren('Marcada para repasar.'); } }, 'Me faltó'));
      card.append(el('div', { class: 'model' }, el('div', {}, model), el('ul', {}, keys.map(k => el('li', {}, k)))), check);
    }}, 'Ver respuesta modelo');
    card.append(el('div', {}, show));
    p.append(card);
  });
}

function buildCmd(p, shuf) {
  p.append(el('p', { class: 'intro' }, 'Cada comando tiene un error. Escribe la versión corregida y luego revisa.'));
  (shuf ? shuffle(CMD) : CMD).forEach(([goal, wrong, right, why], i) => {
    const inp = el('input', { class: 'ans', id: `cmd-${i}`, placeholder: 'Comando corregido…', autocomplete: 'off', spellcheck: 'false' });
    const card = el('article', { class: 'q' }, el('span', { class: 'n' }, `Comando ${i + 1}`), el('p', { class: 'stem' }, goal), el('div', { class: 'wrongcmd' }, wrong), inp);
    const show = el('button', { class: 'btn', type: 'button', onclick: () => {
      show.remove();
      const check = el('div', { class: 'selfcheck' }, '¿Lo tenías bien?',
        el('button', { class: 'btn', type: 'button', onclick: () => { mark('comandos', true); check.replaceChildren('Marcado como correcto.'); } }, 'Sí'),
        el('button', { class: 'btn', type: 'button', onclick: () => { mark('comandos', false); check.replaceChildren('Marcado para repasar.'); } }, 'No'));
      card.append(el('div', { class: 'rightcmd' }, right), el('p', { class: 'why' }, why), check);
    }}, 'Ver solución');
    card.append(el('div', {}, show));
    p.append(card);
  });
}

const BUILDERS = { mcq: buildMCQ, pareo: buildMatch, vf: buildVF, abiertas: buildOpen, comandos: buildCmd };
function build(id, shuf) {
  const p = document.getElementById('panel-' + id);
  p.replaceChildren();
  BUILDERS[id](p, shuf);
  renderScore(id);
}
function select(id) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.id === id)));
  document.querySelectorAll('section.panel').forEach(s => s.hidden = s.id !== 'panel-' + id);
  renderScore(id);
  try { localStorage.setItem('quiz-tab', id); } catch {}
}

const tabs = document.getElementById('tabs'), panels = document.getElementById('panels');
TABS.forEach(([id, name, n]) => {
  tabs.append(el('button', { class: 'tab', role: 'tab', 'data-id': id, type: 'button', onclick: () => select(id) }, `${name} (${n})`));
  panels.append(el('section', { class: 'panel', id: 'panel-' + id, role: 'tabpanel' }));
  build(id, false);
});
let start = (location.hash || '').slice(1);
if (!BUILDERS[start]) { try { start = localStorage.getItem('quiz-tab') || 'mcq'; } catch { start = 'mcq'; } }
select(BUILDERS[start] ? start : 'mcq');
</script>
